name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write OAuth client config
        run: printf '%s' "$OAUTH_CLIENT_JSON" > oauth_client.json
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
      - name: Build app
        run: ./build/build.sh
      - name: Zip .app bundle
        run: ditto -c -k --keepParent "dist/Rhombus Backup Buddy.app" "Rhombus-Backup-Buddy-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Rhombus-Backup-Buddy-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write OAuth client config
        run: printf '%s' "$OAUTH_CLIENT_JSON" > oauth_client.json
        env:
          OAUTH_CLIENT_JSON: ${{ secrets.OAUTH_CLIENT_JSON }}
        shell: bash
      - name: Build app
        run: build\build.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/RhombusBackupBuddy.exe

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pulisse/rhombus-backup-buddy:latest
            ghcr.io/pulisse/rhombus-backup-buddy:${{ github.ref_name }}

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Rhombus-Backup-Buddy-mac.zip
            RhombusBackupBuddy.exe
          generate_release_notes: true
